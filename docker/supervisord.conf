; Two processes, one container.
;
; Render runs a single container per service, but Laravel behind nginx needs
; both nginx and php-fpm alive. supervisord owns them so that if either dies
; the container reports it rather than sitting there serving nothing.

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:php-fpm]
command=php-fpm -F
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
; Started after php-fpm, so the first request cannot arrive at a socket that
; is not listening yet.
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
