; Three processes, one container.
;
; Render runs a single container per service, but Laravel behind nginx needs
; both nginx and php-fpm alive. supervisord owns them so that if either dies
; the container reports it rather than sitting there serving nothing.
;
; The scheduler is here because Render has no cron. `schedule:work` is the
; long-running equivalent of the `* * * * * php artisan schedule:run` entry
; routes/console.php asks for.

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:php-fpm]
command=php-fpm -F
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
; Started after php-fpm, so the first request cannot arrive at a socket that
; is not listening yet.
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; The scheduler, which today means one job: attendance:close-stale, flagging
; shifts nobody clocked out of.
;
; CAVEAT worth knowing before trusting it: a free Render instance is suspended
; after ~15 minutes without traffic, and a suspended container runs no timers.
; If close-stale must fire every day without fail, either keep the service
; awake with an uptime pinger against /up, or upgrade the instance. Running it
; here is still strictly better than the alternative, which is never.
[program:scheduler]
command=php /var/www/html/artisan schedule:work
autostart=true
autorestart=true
user=www-data
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
